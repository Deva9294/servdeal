services:
  - type: web
    name: servdeal-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: OTP_EXPOSE_IN_RESPONSE
        value: false
      - key: SMS_PROVIDER
        scope: secret
      - key: MSG91_AUTH_KEY
        scope: secret
      - key: MSG91_OTP_TEMPLATE_ID
        scope: secret
      - key: RESEND_API_KEY
        scope: secret
      - key: EMAIL_FROM
        scope: secret
      - key: MONGO_URI
        scope: secret
      - key: JWT_SECRET
        scope: secret
      - key: JWT_REFRESH_SECRET
        scope: secret

  - type: web
    name: servdeal-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx next start -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://servdeal-backend.onrender.com/api/v1
      - key: NEXT_PUBLIC_SOCKET_URL
        scope: secret

